<!-- 외주협력사 입회 신청 관리자 대시보드 v1 — Firebase Auth(이메일/비밀번호) + Firestore -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>입회 신청 관리자</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  :root{
    --r:14px; --r-sm:10px;
    --font:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    --mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
    --accent:#0e6b73; --accent-deep:#0a5057; --accent-rgb:14,107,115;
    --bg:#f6f7f9; --paper:#ffffff; --ink:#1d2127; --ink-soft:#646b75; --ink-faint:#9aa0a8;
    --line:#e8eaed; --line-soft:#f1f2f4;
    --shadow-sm:0 1px 2px rgba(20,20,30,.05),0 1px 1px rgba(20,20,30,.03);
    --shadow-md:0 4px 14px rgba(20,20,30,.08);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;}
  #app{max-width:980px;margin:0 auto;padding:20px clamp(14px,3vw,26px) 60px;}
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;}
  .login-card{width:100%;max-width:380px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-md);padding:28px 26px;}
  .login-card h1{font-size:16px;margin:0 0 4px;}
  .login-card .sub{font-size:12px;color:var(--ink-faint);margin-bottom:20px;}
  .field-lbl{font-size:11.5px;font-weight:700;color:var(--ink-faint);letter-spacing:.02em;margin-bottom:6px;}
  .m-block{margin-bottom:14px;}
  .approve-summary{font-size:13px;color:var(--ink-soft);background:var(--bg);border-radius:8px;padding:9px 11px;}
  .m-in{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-family:inherit;font-size:14px;padding:10px 12px;outline:none;color:var(--ink);}
  .m-in:focus{border-color:var(--accent);background:var(--paper);}
  .m-ta{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-family:inherit;font-size:13.5px;padding:9px 11px;outline:none;color:var(--ink);resize:vertical;min-height:60px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .status-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .status-grid button{font-family:inherit;font-size:13px;font-weight:600;padding:9px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink-soft);cursor:pointer;}
  .status-grid button.on-todo{background:#c98a2c;color:#fff;border-color:#c98a2c;}
  .status-grid button.on-done{background:#5a9e2f;color:#fff;border-color:#5a9e2f;}
  .status-grid button.on-delay{background:#3a6fd2;color:#fff;border-color:#3a6fd2;}
  .status-grid button.on-cancel{background:#8b8f97;color:#fff;border-color:#8b8f97;}
  .scrim{position:fixed;inset:0;background:rgba(20,22,26,.42);display:none;align-items:center;justify-content:center;z-index:70;padding:16px;}
  .scrim.show{display:flex;}
  .modal{background:var(--paper);border-radius:16px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);}
  .m-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);}
  .m-head h3{margin:0;font-size:15px;font-weight:700;}
  .m-close{width:28px;height:28px;border-radius:8px;border:none;background:var(--bg);cursor:pointer;color:var(--ink-soft);}
  .m-body{padding:18px;}
  .m-foot{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-top:1px solid var(--line);}
  .m-del{font-family:inherit;font-size:12.5px;font-weight:600;color:#c0392b;background:none;border:none;cursor:pointer;padding:8px 4px;}
  .m-save{font-family:inherit;font-size:13px;font-weight:700;background:var(--accent);color:#fff;border:none;padding:9px 18px;border-radius:9px;cursor:pointer;}
  .btn-submit{width:100%;font-family:inherit;font-size:14.5px;font-weight:700;background:var(--accent);color:#fff;border:none;padding:12px;border-radius:11px;cursor:pointer;margin-top:6px;}
  .btn-submit:hover{background:var(--accent-deep);}
  .msg{font-size:12.5px;padding:9px 12px;border-radius:9px;margin-bottom:12px;}
  .msg.error{background:rgba(210,84,58,.1);color:#c0392b;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
  .brand{display:flex;align-items:center;gap:11px;}
  .brand .mark{width:38px;height:38px;border-radius:11px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .brand h1{font-size:16px;font-weight:800;margin:0;}
  .brand .sub{font-size:11.5px;color:var(--ink-faint);}
  .top-right{display:flex;align-items:center;gap:10px;}
  .top-right .email{font-size:12px;color:var(--ink-faint);}
  .role-pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;}
  .role-pill.admin{background:rgba(14,107,115,.12);color:var(--accent-deep);}
  .role-pill.viewer{background:rgba(139,143,151,.15);color:#5c6068;}
  .btn-ghost{font-family:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);padding:7px 13px;border-radius:9px;cursor:pointer;}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
  .tabs{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:3px;box-shadow:var(--shadow-sm);margin-bottom:18px;}
  .tabs button{font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink-soft);background:none;border:none;padding:8px 15px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .tabs button.on{background:var(--accent);color:#fff;}
  .tabs .badge{background:rgba(255,255,255,.3);border-radius:10px;padding:0 6px;font-size:11px;}
  .tabs button:not(.on) .badge{background:var(--line-soft);color:var(--ink-faint);}
  .req-card{background:var(--paper);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow-sm);padding:15px 17px;margin-bottom:12px;}
  .req-head{display:flex;align-items:center;gap:9px;margin-bottom:8px;flex-wrap:wrap;}
  .req-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .req-company{font-size:13.5px;font-weight:700;}
  .req-date{font-size:12px;color:var(--ink-faint);font-family:var(--mono);}
  .req-status{margin-left:auto;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;}
  .req-status.pending{background:rgba(201,138,44,.15);color:#96660f;}
  .req-status.approved{background:rgba(90,158,47,.15);color:#3d6e1e;}
  .req-status.rejected{background:rgba(139,143,151,.15);color:#5c6068;}
  .req-title{font-size:14px;font-weight:600;margin-bottom:4px;}
  .req-meta{font-size:12px;color:var(--ink-soft);margin-bottom:2px;}
  .req-qty{font-size:11px;font-weight:700;color:var(--accent-deep);background:var(--accent-tint,rgba(14,107,115,.1));padding:1px 8px;border-radius:20px;}
  .visits-toggle{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;cursor:pointer;}
  .hist-search{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
  .hist-search .m-in{flex:1;min-width:180px;}
  .hist-filter{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:2px;flex-shrink:0;}
  .hist-filter button{font-family:inherit;font-size:12px;font-weight:600;color:var(--ink-soft);background:none;border:none;padding:7px 12px;border-radius:7px;cursor:pointer;white-space:nowrap;}
  .hist-filter button.on{background:var(--paper);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .chat-list{display:flex;flex-direction:column;gap:8px;}
  .chat-row{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:12px 14px;cursor:pointer;}
  .chat-row:hover{border-color:var(--accent);}
  .chat-row-body{min-width:0;flex:1;}
  .chat-row-name{font-size:14px;font-weight:700;color:var(--ink);}
  .chat-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#c0392b;margin-left:4px;}
  .chat-row-preview{font-size:12px;color:var(--ink-faint);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .chat-thread{display:flex;flex-direction:column;height:520px;}
  .chat-thread-head{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:12px;}
  .chat-back{font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink-soft);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;}
  .chat-dot-name{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:700;}
  .chat-bubbles{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px;}
  .chat-empty{font-size:12.5px;color:var(--ink-faint);text-align:center;margin-top:30px;}
  .chat-bubble-row{display:flex;}
  .chat-bubble-row.mine{justify-content:flex-end;}
  .chat-bubble{max-width:72%;background:var(--bg);border:1px solid var(--line-soft);border-radius:13px 13px 13px 3px;padding:8px 12px;}
  .chat-bubble.mine{background:var(--accent);color:#fff;border-color:var(--accent);border-radius:13px 13px 3px 13px;}
  .chat-bubble-name{font-size:10.5px;font-weight:700;color:var(--accent-deep);margin-bottom:2px;}
  .chat-bubble-text{font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word;}
  .chat-input-row{display:flex;gap:8px;padding-top:12px;border-top:1px solid var(--line);margin-top:10px;}
  .chat-input-row .m-in{flex:1;}
  .chat-send{font-family:inherit;font-size:13px;font-weight:700;background:var(--accent);color:#fff;border:none;padding:0 18px;border-radius:9px;cursor:pointer;}
  .ann-foot{display:flex;align-items:center;gap:14px;margin-top:10px;}
  .ann-foot .visits-toggle{margin-bottom:0;}
  .ann-date{font-size:11px;color:var(--ink-faint);margin-left:auto;}
  .visits-toggle input{cursor:pointer;}
  .req-memo{font-size:12px;color:var(--ink-faint);margin-top:6px;white-space:pre-wrap;}
  .req-actions{display:flex;gap:8px;margin-top:12px;}
  .btn-approve{font-family:inherit;font-size:12.5px;font-weight:700;background:#5a9e2f;color:#fff;border:none;padding:8px 15px;border-radius:9px;cursor:pointer;}
  .btn-reject{font-family:inherit;font-size:12.5px;font-weight:700;background:var(--paper);color:#c0392b;border:1px solid #c0392b;padding:8px 15px;border-radius:9px;cursor:pointer;}
  .empty{font-size:13px;color:var(--ink-faint);text-align:center;padding:36px 0;}
  .comp-card{background:var(--paper);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow-sm);padding:14px 16px;margin-bottom:12px;}
  .comp-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .comp-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
  .comp-name{font-size:14px;font-weight:700;flex:1;min-width:80px;}
  .comp-input{border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:12.5px;padding:6px 9px;outline:none;width:120px;}
  .comp-input:focus{border-color:var(--accent);background:var(--paper);}
  .link-row{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line-soft);border-radius:9px;padding:8px 10px;}
  .link-row input{flex:1;border:none;background:none;font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);outline:none;min-width:0;}
  .link-copy{font-family:inherit;font-size:11.5px;font-weight:600;background:var(--accent);color:#fff;border:none;padding:6px 11px;border-radius:7px;cursor:pointer;white-space:nowrap;}
  .btn-add-comp{font-family:inherit;font-size:13px;font-weight:600;border:1px dashed var(--line);background:var(--paper);color:var(--ink-soft);padding:11px;border-radius:11px;cursor:pointer;width:100%;}
  .btn-add-comp:hover{border-color:var(--accent);color:var(--accent);}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;padding:9px 18px;border-radius:20px;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .25s;z-index:80;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div id="root"><div style="padding:60px;text-align:center;color:var(--ink-faint);">불러오는 중…</div></div>
<div class="toast" id="toast"></div>
<div class="scrim" id="scrim" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
/* ══════════════ Firebase 설정 — 본인 프로젝트 값으로 교체하세요 (신청 페이지와 동일한 프로젝트) ══════════════ */
const firebaseConfig = {
  apiKey: "AIzaSyD7jN8RBv0preJmxNVBZwiacznq7-UdGM4",
  authDomain: "contractor-visit.firebaseapp.com",
  projectId: "contractor-visit",
  storageBucket: "contractor-visit.firebasestorage.app",
  messagingSenderId: "335380660226",
  appId: "1:335380660226:web:b56a9cf5727671c23ae71b",
  measurementId: "G-YR2DSRJZFN"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const SEED_COMPANIES=[
  {name:'가온해',color:'#0e6b73'},
  {name:'유일전기',color:'#6d4ed6'},
  {name:'극동전기',color:'#c98a2c'},
  {name:'구주기술',color:'#5a9e2f'},
  {name:'국제전기',color:'#e0483f'},
];

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function uid(){return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window._toastT);window._toastT=setTimeout(()=>t.classList.remove('show'),2400);}

let tab='pending';
let historyQuery='';
let historyStatusFilter='all';
let messagesCache=[];
let activeChatCompanyId=null;
let announcementsCache=[];
let companiesCache={};
let requestsCache=[];
let visitsCache=[];
let staffCache={};
let settingsCache={internalEmails:[]};
let myRole=null; // 'admin' | 'viewer' | null(미승인)
let unsubs=[];

function isAdmin(){return myRole==='admin';}
function emailKey(e){return (e||'').trim().toLowerCase();}

/* ══════════════ 로그인 화면 ══════════════ */
function renderLogin(errMsg){
  document.getElementById('root').innerHTML = `
    <div class="login-wrap"><div class="login-card">
      <h1>입회 신청 관리자</h1>
      <div class="sub">담당자 계정으로 로그인하세요</div>
      ${errMsg?`<div class="msg error">${esc(errMsg)}</div>`:''}
      <div class="m-block"><div class="field-lbl">이메일</div><input type="email" class="m-in" id="login-email"></div>
      <div class="m-block"><div class="field-lbl">비밀번호</div><input type="password" class="m-in" id="login-pw"></div>
      <button class="btn-submit" id="login-btn" onclick="doLogin()">로그인</button>
    </div></div>`;
  document.getElementById('login-pw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
}
function doLogin(){
  const email=document.getElementById('login-email').value.trim();
  const pw=document.getElementById('login-pw').value;
  const btn=document.getElementById('login-btn');
  btn.disabled=true; btn.textContent='로그인 중…';
  auth.signInWithEmailAndPassword(email,pw).catch(err=>{
    renderLogin('로그인 실패: '+(err.message||'이메일 또는 비밀번호를 확인해주세요.'));
  });
}
function doLogout(){ unsubs.forEach(u=>u()); unsubs=[]; auth.signOut(); }

/* ══════════════ 대시보드 ══════════════ */
function setTab(t){tab=t;renderDashboard();}

function renderDashboard(){
  const user=auth.currentUser;
  const pendingCount = requestsCache.filter(r=>r.status==='pending').length;
  const roleBadge = isAdmin()?'관리자':'조회자';
  document.getElementById('root').innerHTML = `
    <div id="app">
      <div class="topbar">
        <div class="brand">
          <span class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2.5"/><path d="M3 9h18M8 2v4M16 2v4"/></svg></span>
          <div><h1>입회 신청 관리자</h1><div class="sub">협력사 신청 승인/거절 · 링크 관리</div></div>
        </div>
        <div class="top-right"><span class="role-pill ${isAdmin()?'admin':'viewer'}">${roleBadge}</span><span class="email">${esc(user?user.email:'')}</span><button class="btn-ghost" onclick="doLogout()">로그아웃</button></div>
      </div>
      <div class="tabs">
        <button class="${tab==='pending'?'on':''}" onclick="setTab('pending')">대기 중${pendingCount?` <span class="badge">${pendingCount}</span>`:''}</button>
        <button class="${tab==='history'?'on':''}" onclick="setTab('history')">처리 내역</button>
        <button class="${tab==='visits'?'on':''}" onclick="setTab('visits')">확정 일정</button>
        <button class="${tab==='companies'?'on':''}" onclick="setTab('companies')">협력사 관리</button>
        <button class="${tab==='chat'?'on':''}" onclick="setTab('chat')">💬 채팅${chatUnreadTotal()?` <span class="badge">${chatUnreadTotal()}</span>`:''}</button>
        ${isAdmin()?`<button class="${tab==='announce'?'on':''}" onclick="setTab('announce')">📢 공지사항</button>`:''}
        ${isAdmin()?`<button class="${tab==='staff'?'on':''}" onclick="setTab('staff')">직원 관리</button>
        <button class="${tab==='settings'?'on':''}" onclick="setTab('settings')">설정</button>`:''}
      </div>
      <div id="tab-body"></div>
    </div>`;
  renderTabBody();
}

function fmtDate(e){
  if(!e.date)return '-';
  const [y,m,d]=e.date.split('-');
  if(e.endDate&&e.endDate!==e.date){const [,m2,d2]=e.endDate.split('-');return `${+m}/${+d} ~ ${+m2}/${+d2}`;}
  return `${y}.${+m}.${+d}`;
}

function renderTabBody(){
  const body=document.getElementById('tab-body');
  if(!body)return;
  if(tab==='pending'){
    const rows=requestsCache.filter(r=>r.status==='pending').sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    body.innerHTML = rows.length ? rows.map(reqCardHtml).join('') : '<div class="empty">대기 중인 신청이 없어요.</div>';
  }else if(tab==='history'){
    body.innerHTML = `
      <div class="hist-search">
        <input type="text" class="m-in" id="hist-search-input" placeholder="협력사·제목·프로젝트·신청자 검색" value="${esc(historyQuery)}" oninput="historyQuery=this.value;renderHistoryList();">
        <div class="hist-filter">
          <button class="${historyStatusFilter==='all'?'on':''}" onclick="setHistoryStatusFilter('all')">전체</button>
          <button class="${historyStatusFilter==='approved'?'on':''}" onclick="setHistoryStatusFilter('approved')">승인됨</button>
          <button class="${historyStatusFilter==='rejected'?'on':''}" onclick="setHistoryStatusFilter('rejected')">거절됨</button>
        </div>
      </div>
      <div id="hist-list"></div>`;
    renderHistoryList();
  }else if(tab==='visits'){
    renderVisitsTab(body);
  }else if(tab==='companies'){
    renderCompaniesTab(body);
  }else if(tab==='chat'){
    renderChatTab(body);
  }else if(tab==='announce'&&isAdmin()){
    renderAnnounceTab(body);
  }else if(tab==='staff'&&isAdmin()){
    renderStaffTab(body);
  }else if(tab==='settings'&&isAdmin()){

function saveVisitEditor(){
  const v=visitsCache.find(x=>x.id===visitEditId); if(!v)return;
  const before={date:v.date,endDate:v.endDate||v.date,time:v.time||'',project:v.project||'',qty:v.qty,title:v.title||'',attendee:v.attendee||'',status:v.status};
  const after={
    date:document.getElementById('ve-date').value,
    endDate:document.getElementById('ve-end').value,
    time:document.getElementById('ve-time').value.trim(),
    project:document.getElementById('ve-project').value.trim(),
    qty:(function(){const s=document.getElementById('ve-qty').value;return s===''?null:Math.max(0,parseInt(s,10)||0);})(),
    title:document.getElementById('ve-title').value.trim(),
    attendee:document.getElementById('ve-attendee').value.trim(),
    memo:document.getElementById('ve-memo').value.trim(),
    status:document.getElementById('modal').dataset.status||v.status,
  };
  const company=companiesCache[v.companyId];
  const changes=[];
  if(before.date!==after.date||before.endDate!==after.endDate){
    const oldR=before.endDate&&before.endDate!==before.date?`${before.date}~${before.endDate}`:before.date;
    const newR=after.endDate&&after.endDate!==after.date?`${after.date}~${after.endDate}`:after.date;
    changes.push(`날짜: ${oldR} → ${newR}`);
  }
  if(before.time!==after.time)changes.push(`방문 시간: ${before.time||'-'} → ${after.time||'-'}`);
  if(before.title!==after.title)changes.push(`제목: ${before.title||'-'} → ${after.title||'-'}`);
  if(before.attendee!==after.attendee)changes.push(`입회자: ${before.attendee||'-'} → ${after.attendee||'-'}`);
  if(before.status!==after.status)changes.push(`상태: ${before.status} → ${after.status}`);
  if(String(before.qty)!==String(after.qty))changes.push(`대수: ${before.qty??'-'} → ${after.qty??'-'}`);

  db.collection('visits').doc(v.id).update(Object.assign({},after,{updatedAt:firebase.firestore.FieldValue.serverTimestamp()}))
    .then(()=>{
      toast('저장했어요.');
      closeVisitEditor();
      if(changes.length){
        sendMail(notifyList(company), `[입회 일정 변경] ${company?company.name:''} · ${after.title}`,
          `입회 일정이 변경되었습니다.\n\n${changes.join('\n')}`);
        pushNotification(v.companyId, `✎ 변경: ${after.title||'(제목 없음)'}`, changes.join('\n'));
      }
    }).catch(err=>toast('오류: '+err.message));
}

/* ══════════════ 채팅 (협력사별 1:1 대화방) ══════════════ */
function msgMillis(m){
  if(!m.createdAt)return 0;
  if(typeof m.createdAt.toMillis==='function')return m.createdAt.toMillis();
  if(m.createdAt.seconds)return m.createdAt.seconds*1000;
  return 0;
}
function chatSeenKey(cid){return 'adminChatSeen_'+cid;}
function chatSeenAt(cid){return parseInt(localStorage.getItem(chatSeenKey(cid))||'0',10);}
function markChatSeen(cid){localStorage.setItem(chatSeenKey(cid), String(Date.now()));}
function chatUnreadFor(cid){
  const seen=chatSeenAt(cid);
  return messagesCache.filter(m=>m.companyId===cid && m.sender==='company' && msgMillis(m)>seen).length;
}
function chatUnreadTotal(){
  const ids=Object.keys(companiesCache);
  return ids.reduce((sum,id)=>sum+chatUnreadFor(id),0);
}
function updateChatBadgeOnly(){
  const btn=document.querySelector('.tabs button[onclick*="setTab(\'chat\')"]');
  if(!btn)return;
  const n=chatUnreadTotal();
  btn.innerHTML = `💬 채팅${n?` <span class="badge">${n}</span>`:''}`;
}

}

      <textarea class="m-ta" style="margin-top:8px;" onchange="updateAnnField('${a.id}','body',this.value)">${esc(a.body||'')}</textarea>
      <div class="ann-foot">
        <label class="visits-toggle"><input type="checkbox" ${a.active?'checked':''} onchange="toggleAnnActive('${a.id}',this.checked)"> 게시 중 (협력사에게 보임)</label>
        <span class="ann-date">${dateTxt}</span>
        <button class="btn-reject" onclick="deleteAnnouncement('${a.id}')">🗑 삭제</button>
      </div>
    </div>`;
  }).join('');
  body.innerHTML = formHtml + (rows||'<div class="empty">등록된 공지사항이 없어요.</div>');
}
function addAnnouncement(){
  const title=document.getElementById('ann-title').value.trim();
  const bodyTxt=document.getElementById('ann-body').value.trim();
  if(!title){toast('제목을 입력해주세요.');return;}
  db.collection('announcements').add({
    title, body:bodyTxt, active:true,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(()=>toast('공지를 게시했어요.')).catch(err=>toast('오류: '+err.message));
}
function updateAnnField(id,field,val){
  db.collection('announcements').doc(id).update({[field]:val}).then(()=>toast('저장됐어요.')).catch(err=>toast('오류: '+err.message));
}
function toggleAnnActive(id,val){
  db.collection('announcements').doc(id).update({active:val}).catch(err=>toast('오류: '+err.message));
}
function deleteAnnouncement(id){
  if(!confirm('이 공지사항을 삭제할까요?'))return;
  db.collection('announcements').doc(id).delete().then(()=>toast('삭제했어요.')).catch(err=>toast('오류: '+err.message));
}

function renderChatTab(body){
  if(activeChatCompanyId){ renderChatThread(body); return; }
  const ids=Object.keys(companiesCache);
  if(!ids.length){ body.innerHTML='<div class="empty">등록된 협력사가 없어요.</div>'; return; }
  const rows=ids.map(id=>{
    const c=companiesCache[id];
    const msgs=messagesCache.filter(m=>m.companyId===id);
    const last=msgs[msgs.length-1];
    const unread=chatUnreadFor(id);
    return `<div class="chat-row" onclick="openChatThread('${id}')">
      <span class="comp-dot" style="background:${c.color||'#999'}"></span>
      <div class="chat-row-body">
        <div class="chat-row-name">${esc(c.name)}${unread?` <span class="chat-dot"></span>`:''}</div>
        <div class="chat-row-preview">${last?esc((last.senderName?last.senderName+': ':'')+last.text).slice(0,40):'대화 없음'}</div>
      </div>
    </div>`;
  }).join('');
  body.innerHTML = `<div class="chat-list">${rows}</div>`;
}
function openChatThread(cid){
  activeChatCompanyId=cid;
  markChatSeen(cid);
  renderTabBody();
}
function closeChatThread(){
  activeChatCompanyId=null;
  renderTabBody();
}
function renderChatThread(body){
  const c=companiesCache[activeChatCompanyId];
  const msgs=messagesCache.filter(m=>m.companyId===activeChatCompanyId);
  const bubbles=msgs.length?msgs.map(m=>{
    const mine=m.sender==='admin';
    return `<div class="chat-bubble-row ${mine?'mine':''}">
      <div class="chat-bubble ${mine?'mine':''}">
        ${!mine?`<div class="chat-bubble-name">${esc(m.senderName||'협력사')}</div>`:''}
        <div class="chat-bubble-text">${esc(m.text||'')}</div>
      </div>
    </div>`;
  }).join(''):'<div class="chat-empty">아직 대화가 없어요.</div>';
  body.innerHTML = `
    <div class="chat-thread">
      <div class="chat-thread-head">
        <button class="chat-back" onclick="closeChatThread()">← 목록</button>
        <span class="chat-dot-name"><span class="comp-dot" style="background:${c?c.color:'#999'}"></span>${esc(c?c.name:'(삭제된 업체)')}</span>
      </div>
      <div class="chat-bubbles" id="chat-bubbles">${bubbles}</div>
      ${isAdmin()?`<div class="chat-input-row">
        <input type="text" class="m-in" id="chat-input" placeholder="메시지를 입력하세요" onkeydown="if(event.key==='Enter')sendChatMessage()">
        <button class="chat-send" onclick="sendChatMessage()">전송</button>
      </div>`:''}
    </div>`;
  const bub=document.getElementById('chat-bubbles');
  if(bub) bub.scrollTop=bub.scrollHeight;
}
function sendChatMessage(){
  const input=document.getElementById('chat-input');
  const text=input.value.trim();
  if(!text||!activeChatCompanyId)return;
  input.value='';
  const user=auth.currentUser;
  db.collection('messages').add({
    companyId: activeChatCompanyId,
    sender: 'admin',
    senderName: (user&&user.email)?user.email.split('@')[0]:'담당자',
    text: text,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(()=>{ markChatSeen(activeChatCompanyId); }).catch(err=>toast('전송 실패: '+err.message));
}

function renderCompaniesTab(body){
  const ids=Object.keys(companiesCache);
  const seedBtn = isAdmin()?`<button class="btn-add-comp" onclick="seedCompanies()">＋ 기본 5개사로 초기 등록 (가온해·유일전기·극동전기·구주기술·국제전기)</button>
    <button class="btn-add-comp" onclick="seedTestCompanies()" style="margin-top:8px;">＋ 테스트용 회사1·회사2 추가</button>`:'';
  if(!ids.length){
    body.innerHTML = `<div class="empty">등록된 협력사가 없어요.</div>${seedBtn}`;
    return;
  }
  const editable=isAdmin();
  const rows=ids.map(id=>{
    const c=companiesCache[id];
    const fields = editable ? `
        <input class="comp-input" placeholder="담당자" value="${esc(c.contact||'')}" onchange="setCompField('${id}','contact',this.value)">
        <input class="comp-input" placeholder="연락처" value="${esc(c.phone||'')}" onchange="setCompField('${id}','phone',this.value)">
        <input class="comp-input" placeholder="이메일" value="${esc(c.email||'')}" onchange="setCompField('${id}','email',this.value)">` : `
        <span class="req-meta">${esc(c.contact||'-')} · ${esc(c.phone||'-')} · ${esc(c.email||'-')}</span>`;
    return `<div class="comp-card">
      <div class="comp-row">
        <span class="comp-dot" style="background:${c.color||'#999'}"></span>
        <span class="comp-name">${esc(c.name)}</span>
        ${fields}
        ${editable?`<button class="btn-reject" onclick="deleteCompany('${id}')" title="이 협력사 삭제">🗑 삭제</button>`:''}
      </div>
      <div class="link-row"><input readonly value="${requestLinkFor(id)}" onclick="this.select()"><button class="link-copy" onclick="copyLink('${id}')">복사</button></div>
    </div>`;
  }).join('');
  body.innerHTML = rows + (isAdmin()?`<button class="btn-add-comp" onclick="addCompany()">＋ 협력사 추가</button>`:'');
}
function setCompField(id,field,val){
  db.collection('companies').doc(id).update({[field]:val}).then(()=>toast('저장됐어요.')).catch(err=>toast('오류: '+err.message));
}
function copyLink(id){
  const link=requestLinkFor(id);
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=link;ta.style.position='fixed';ta.style.top='-9999px';document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand('copy');toast('링크를 복사했어요.');}catch(e){toast('복사 실패');}ta.remove();};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(link).then(()=>toast('링크를 복사했어요.')).catch(fallback);}else fallback();
}
function seedCompanies(){
  const batchPromises = SEED_COMPANIES.map(c=>db.collection('companies').doc(uid()).set({name:c.name,color:c.color,contact:'',phone:'',email:''}));
  Promise.all(batchPromises).then(()=>toast('기본 5개사를 등록했어요.')).catch(err=>toast('오류: '+err.message));
}
function seedTestCompanies(){
  const tests=[{name:'회사1',color:'#3a6fd2'},{name:'회사2',color:'#a24fb0'}];
  const batchPromises = tests.map(c=>db.collection('companies').doc(uid()).set({name:c.name,color:c.color,contact:'',phone:'',email:''}));
  Promise.all(batchPromises).then(()=>toast('테스트용 회사1·회사2를 추가했어요.')).catch(err=>toast('오류: '+err.message));
}
function addCompany(){
  const name=prompt('새 협력사 이름:'); if(!name||!name.trim())return;
  const colors=['#0e6b73','#6d4ed6','#c98a2c','#5a9e2f','#e0483f','#3a6fd2','#a24fb0'];
  const color=colors[Object.keys(companiesCache).length % colors.length];
  db.collection('companies').doc(uid()).set({name:name.trim(),color,contact:'',phone:'',email:''}).then(()=>toast('협력사를 추가했어요.')).catch(err=>toast('오류: '+err.message));
}
function deleteCompany(id){
  const c=companiesCache[id]; if(!c)return;
  const inUse = requestsCache.some(r=>r.companyId===id) || visitsCache.some(v=>v.companyId===id);
  const msg = inUse
    ? `'${c.name}' 협력사를 삭제할까요?\n\n이미 등록된 신청/확정 일정 기록이 있어요 — 그 기록들은 남지만 업체명 대신 "(삭제된 업체)"로 표시돼요.`
    : `'${c.name}' 협력사를 삭제할까요? 이 작업은 되돌릴 수 없어요.`;
  if(!confirm(msg))return;
  db.collection('companies').doc(id).delete().then(()=>toast(`'${c.name}' 삭제했어요.`)).catch(err=>toast('오류: '+err.message));
}

/* ══════════════ 직원 관리 탭 (관리자 전용) ══════════════ */
function renderStaffTab(body){
  const emails=Object.keys(staffCache);
  const rows=emails.length ? emails.map(em=>{
    const s=staffCache[em];
    const isMe = auth.currentUser && emailKey(auth.currentUser.email)===em;
    return `<div class="comp-card">
      <div class="comp-row">
        <span class="comp-name">${esc(s.email||em)}${isMe?' (나)':''}</span>
        <select class="comp-input" onchange="setStaffRole('${em}',this.value)" ${isMe?'disabled title="본인 권한은 변경할 수 없어요"':''}>
          <option value="admin" ${s.role==='admin'?'selected':''}>관리자</option>
          <option value="viewer" ${s.role==='viewer'?'selected':''}>조회자</option>
        </select>
        ${!isMe?`<button class="btn-reject" onclick="removeStaff('${em}')">삭제</button>`:''}
      </div>
    </div>`;
  }).join('') : '<div class="empty">등록된 직원이 없어요.</div>';
  body.innerHTML = rows + `
    <div class="comp-card">
      <div class="comp-row">
        <input class="comp-input" style="flex:1;min-width:160px;" placeholder="이메일" id="new-staff-email">
        <select class="comp-input" id="new-staff-role"><option value="viewer">조회자</option><option value="admin">관리자</option></select>
        <button class="link-copy" onclick="addStaff()">추가</button>
      </div>
    </div>`;
}
function addStaff(){
  const email=emailKey(document.getElementById('new-staff-email').value);
  const role=document.getElementById('new-staff-role').value;
  if(!email||!email.includes('@')){toast('올바른 이메일을 입력해주세요.');return;}
  db.collection('staff').doc(email).set({email,role}).then(()=>toast('직원을 추가했어요. (Firebase Authentication에도 계정을 만들어주세요)')).catch(err=>toast('오류: '+err.message));
}
function setStaffRole(email,role){
  db.collection('staff').doc(email).update({role}).then(()=>toast('권한을 변경했어요.')).catch(err=>toast('오류: '+err.message));
}
function removeStaff(email){
  if(!confirm(email+' 직원을 삭제할까요?'))return;
  db.collection('staff').doc(email).delete().then(()=>toast('삭제했어요.')).catch(err=>toast('오류: '+err.message));
}

/* ══════════════ 설정 탭 (관리자 전용, 우리측 알림 이메일) ══════════════ */
function renderSettingsTab(body){
  const list=(settingsCache.internalEmails||[]).join(', ');
  body.innerHTML = `
    <div class="comp-card">
      <div class="field-lbl">우리측(LSPS) 알림 이메일 — 승인·거절·변경·취소 시 항상 참조로 받을 주소 (쉼표로 여러 개)</div>
      <textarea class="m-in" id="internal-emails" style="min-height:70px;margin-top:8px;">${esc(list)}</textarea>
      <button class="btn-submit" style="margin-top:10px;" onclick="saveInternalEmails()">저장</button>
    </div>`;
}
function saveInternalEmails(){
  const raw=document.getElementById('internal-emails').value;
  const list=[...new Set(raw.split(',').map(emailKey).filter(Boolean))];
  db.collection('settings').doc('general').set({internalEmails:list},{merge:true}).then(()=>toast('저장했어요.')).catch(err=>toast('오류: '+err.message));
}

/* ══════════════ 실시간 구독 (오류 시 자동 재시도) ══════════════ */
function watchCollection(colRef, onData, label){
  return colRef.onSnapshot(onData, err=>{
    console.error(label+' 구독 오류:', err);
    toast('⚠ '+label+' 불러오기 실패, 재시도 중…');
    setTimeout(()=>{ unsubs.push(watchCollection(colRef, onData, label)); }, 1500);
  });
}
function startListeners(){
  unsubs.push(watchCollection(db.collection('companies'), snap=>{
    companiesCache={};
    snap.forEach(doc=>{companiesCache[doc.id]=doc.data();});
    renderTabBody();
  }, '협력사'));
  unsubs.push(watchCollection(db.collection('requests'), snap=>{
    requestsCache = snap.docs.map(doc=>Object.assign({id:doc.id},doc.data()));
    renderDashboard();
  }, '신청 내역'));
  unsubs.push(watchCollection(db.collection('visits'), snap=>{
    visitsCache = snap.docs.map(doc=>Object.assign({id:doc.id},doc.data()));
    renderTabBody();
  }, '확정 일정'));
  unsubs.push(watchCollection(db.collection('staff'), snap=>{
    staffCache={};
    snap.forEach(doc=>{staffCache[doc.id]=doc.data();});
    renderTabBody();
  }, '직원 목록'));
  unsubs.push(watchCollection(db.collection('settings').doc('general'), doc=>{
    settingsCache = doc.exists ? Object.assign({internalEmails:[]},doc.data()) : {internalEmails:[]};
    renderTabBody();
  }, '설정'));
  unsubs.push(watchCollection(db.collection('messages'), snap=>{
    messagesCache = snap.docs.map(doc=>Object.assign({id:doc.id},doc.data())).sort((a,b)=>msgMillis(a)-msgMillis(b));
    if(tab==='chat') renderTabBody();
    else updateChatBadgeOnly();
  }, '채팅'));
  unsubs.push(watchCollection(db.collection('announcements'), snap=>{
    announcementsCache = snap.docs.map(doc=>Object.assign({id:doc.id},doc.data())).sort((a,b)=>annMillis(b)-annMillis(a));
    renderTabBody();
  }, '공지사항'));
}

/* ══════════════ 권한 확인 (staff 등록 여부·역할) ══════════════ */
function renderNoAccess(email){
  document.getElementById('root').innerHTML = `
    <div class="login-wrap"><div class="login-card">
      <h1>접근 권한이 없어요</h1>
      <div class="sub">${esc(email)} 계정은 아직 직원으로 등록되지 않았어요.<br>관리자에게 등록을 요청해주세요.</div>
      <div class="msg error" style="margin-top:14px;">처음 설정하는 경우: Firebase 콘솔 → Firestore Database에서 <b>staff</b> 컬렉션에 문서를 직접 하나 만들고, 문서 ID와 email 필드에 이 이메일(${esc(email)})을, role 필드에 "admin"을 입력해주세요.</div>
      <button class="btn-submit" onclick="doLogout()">로그아웃</button>
    </div></div>`;
}
function resolveRoleAndEnter(user){
  db.collection('staff').doc(emailKey(user.email)).get().then(doc=>{
    if(!doc.exists){ myRole=null; renderNoAccess(user.email); return; }
    myRole = doc.data().role==='admin' ? 'admin' : 'viewer';
    renderDashboard(); startListeners();
  }).catch(err=>{ toast('권한 확인 오류: '+err.message); });
}

/* ══════════════ 인증 상태 감시 ══════════════ */
auth.onAuthStateChanged(user=>{
  if(user){ resolveRoleAndEnter(user); }
  else{ myRole=null; unsubs.forEach(u=>u()); unsubs=[]; renderLogin(); }
});
</script>
