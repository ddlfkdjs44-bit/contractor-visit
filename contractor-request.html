<!-- 외주협력사 입회 신청 페이지 v2 — Firebase Firestore 연동. 협력사는 로그인 없이 고유 링크(?co=업체ID)로 접속해 신청만 등록합니다. -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>입회 일정 신청</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');
  :root{
    --r:14px; --r-sm:10px;
    --font:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    --accent:#0e6b73; --accent-deep:#0a5057; --accent-rgb:14,107,115;
    --bg:#f6f7f9; --paper:#ffffff; --ink:#1d2127; --ink-soft:#646b75; --ink-faint:#9aa0a8;
    --line:#e8eaed; --line-soft:#f1f2f4;
    --shadow-md:0 4px 14px rgba(20,20,30,.08);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;}
  .card{width:100%;max-width:460px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-md);padding:26px 24px 24px;}
  .head{display:flex;align-items:center;gap:11px;margin-bottom:18px;}
  .head .mark{width:38px;height:38px;border-radius:11px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .head h1{font-size:16px;font-weight:800;margin:0;}
  .head .sub{font-size:12px;color:var(--ink-faint);margin-top:1px;}
  .notif-bellbtn{position:relative;margin-left:auto;background:none;border:none;font-size:18px;cursor:pointer;padding:6px;border-radius:9px;flex-shrink:0;}
  .notif-bellbtn:hover{background:var(--bg);}
  .notif-badge{position:absolute;top:0;right:0;background:#c0392b;color:#fff;font-size:9.5px;font-weight:700;min-width:15px;height:15px;border-radius:20px;display:inline-flex;align-items:center;justify-content:center;padding:0 3px;}
  .notif-panel{display:none;flex-direction:column;gap:8px;max-height:260px;overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:10px;margin:-6px 0 16px;}
  .ann-banner{display:flex;align-items:flex-start;gap:10px;background:rgba(201,138,44,.1);border:1px solid rgba(201,138,44,.35);border-radius:11px;padding:11px 12px;margin-bottom:10px;}
  .ann-banner-body{flex:1;min-width:0;}
  .ann-banner-title{font-size:12.5px;font-weight:700;color:#8a5a10;}
  .ann-banner-text{font-size:12px;color:#8a5a10;margin-top:3px;line-height:1.5;white-space:pre-wrap;}
  .ann-banner-close{flex-shrink:0;background:none;border:none;color:#8a5a10;opacity:.6;cursor:pointer;font-size:13px;padding:2px;}
  .ann-banner-close:hover{opacity:1;}
  .notif-panel.show{display:flex;}
  .notif-item{background:var(--paper);border:1px solid var(--line-soft);border-radius:9px;padding:8px 10px;}
  .notif-title{font-size:12.5px;font-weight:700;color:var(--ink);}
  .notif-msg{font-size:11.5px;color:var(--ink-soft);margin-top:3px;white-space:pre-wrap;line-height:1.5;}
  .notif-empty{font-size:12px;color:var(--ink-faint);text-align:center;padding:10px 0;}
  .chat-thread{display:flex;flex-direction:column;}
  .chat-name-row{margin-bottom:12px;}
  .chat-bubbles{display:flex;flex-direction:column;gap:8px;min-height:260px;max-height:360px;overflow-y:auto;padding:4px 2px;border:1px solid var(--line-soft);border-radius:11px;background:var(--bg);margin-bottom:12px;}
  .chat-empty{font-size:12.5px;color:var(--ink-faint);text-align:center;margin:auto;padding:20px 10px;}
  .chat-bubble-row{display:flex;padding:0 8px;}
  .chat-bubble-row.mine{justify-content:flex-end;}
  .chat-bubble{max-width:76%;background:var(--paper);border:1px solid var(--line-soft);border-radius:13px 13px 13px 3px;padding:8px 12px;}
  .chat-bubble.mine{background:var(--accent);color:#fff;border-color:var(--accent);border-radius:13px 13px 3px 13px;}
  .chat-bubble-name{font-size:10.5px;font-weight:700;color:var(--accent-deep);margin-bottom:2px;}
  .chat-bubble-text{font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word;}
  .chat-input-row{display:flex;gap:8px;}
  .chat-input-row .m-in{flex:1;}
  .chat-send{font-family:inherit;font-size:13px;font-weight:700;background:var(--accent);color:#fff;border:none;padding:0 18px;border-radius:9px;cursor:pointer;}
  .field-lbl{font-size:11.5px;font-weight:700;color:var(--ink-faint);letter-spacing:.02em;margin-bottom:6px;}
  .m-block{margin-bottom:14px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .m-in,.m-ta{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-family:inherit;font-size:14px;padding:10px 12px;outline:none;color:var(--ink);}
  .m-in:focus,.m-ta:focus{border-color:var(--accent);background:var(--paper);}
  .m-ta{resize:vertical;min-height:70px;}
  .company-badge{display:flex;align-items:center;gap:9px;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:18px;}
  .company-badge .dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
  .company-badge b{font-size:15px;}
  .company-badge span{font-size:11.5px;color:var(--ink-faint);}
  .btn-submit{width:100%;font-family:inherit;font-size:14.5px;font-weight:700;background:var(--accent);color:#fff;border:none;padding:13px;border-radius:11px;cursor:pointer;margin-top:6px;}
  .btn-submit:hover{background:var(--accent-deep);}
  .btn-submit:disabled{opacity:.5;cursor:default;}
  .msg{font-size:12.5px;padding:10px 13px;border-radius:9px;margin-bottom:14px;}
  .msg.error{background:rgba(210,84,58,.1);color:#c0392b;}
  .msg.ok{background:rgba(90,158,47,.1);color:#3d6e1e;}
  .state-loading,.state-error{text-align:center;padding:40px 10px;color:var(--ink-faint);font-size:13.5px;}
  .success-wrap{text-align:center;padding:20px 6px;}
  .success-wrap .ico{font-size:40px;margin-bottom:10px;}
  .success-wrap h2{font-size:16px;margin:0 0 8px;}
  .success-wrap p{font-size:13px;color:var(--ink-soft);line-height:1.6;margin:0 0 20px;}
  .btn-ghost{font-family:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);padding:9px 16px;border-radius:9px;cursor:pointer;}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
  .myreq-head{font-size:12px;font-weight:700;color:var(--ink-faint);margin:22px 0 10px;padding-top:16px;border-top:1px solid var(--line);}
  .myreq-head span{font-weight:500;color:var(--ink-faint);}
  .myreq-list{display:flex;flex-direction:column;gap:8px;}
  .myreq-loading{font-size:12px;color:var(--ink-faint);}
  .myreq-err{font-size:12px;color:#c0392b;background:rgba(210,84,58,.08);border-radius:9px;padding:9px 12px;}
  .myreq-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 12px;}
  .myreq-title{font-size:13px;font-weight:600;color:var(--ink);}
  .myreq-date{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}
  .myreq-del{flex-shrink:0;font-family:inherit;font-size:12px;font-weight:600;color:#c0392b;background:none;border:1px solid #c0392b;padding:6px 10px;border-radius:7px;cursor:pointer;}
  .myreq-del:hover{background:#c0392b;color:#fff;}
  .myreq-badge{display:inline-block;font-size:10.5px;font-weight:700;padding:1.5px 8px;border-radius:20px;margin-left:2px;}
  .myreq-badge.ok{background:rgba(90,158,47,.15);color:#3d6e1e;}
  .myreq-badge.no{background:rgba(210,84,58,.12);color:#c0392b;}
  .myreq-note{font-size:11.5px;color:var(--ink-soft);margin-top:4px;background:var(--paper);border:1px solid var(--line-soft);border-radius:7px;padding:5px 9px;}
  /* ── 탭 ── */
  .tabbar{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:18px;}
  .tabbar button{flex:1;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink-soft);background:none;border:none;padding:8px 6px;border-radius:8px;cursor:pointer;}
  .tabbar button.on{background:var(--paper);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.08);}
  /* ── 우리 회사 일정 캘린더 (읽기 전용) ── */
  .cal-loading{font-size:12.5px;color:var(--ink-faint);text-align:center;padding:30px 0;}
  .cal-modetoggle{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:2px;margin-bottom:10px;width:fit-content;}
  .cal-modetoggle button{font-family:inherit;font-size:11.5px;font-weight:600;color:var(--ink-soft);background:none;border:none;padding:5px 12px;border-radius:7px;cursor:pointer;}
  .cal-modetoggle button.on{background:var(--paper);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .cal-nav{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:12px;}
  .cal-navbtn{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);cursor:pointer;font-size:13px;}
  .cal-navbtn:hover{border-color:var(--accent);color:var(--accent);}
  .cal-month{font-size:13.5px;font-weight:700;color:var(--ink);min-width:88px;text-align:center;}
  .cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px;}
  .cal-weekdays div{text-align:center;font-size:9.5px;font-weight:700;color:var(--ink-faint);}
  .cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px;}
  .cal-cell{position:relative;min-height:56px;border:1px solid var(--line-soft);border-radius:6px;padding:3px 3px;overflow:hidden;}
  .cal-cell.muted{opacity:.35;}
  .cal-cell.today{border-color:var(--accent);background:rgba(var(--accent-rgb),.06);}
  .cal-dnum{font-size:9.5px;font-weight:600;color:var(--ink-soft);}
  .cal-bar{margin-top:2px;background:var(--accent);color:#fff;font-size:8.5px;font-weight:600;line-height:1.5;border-radius:3px;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}
  .cal-bar:hover{filter:brightness(.92);}
  .cal-bar-cancel{background:var(--ink-faint);text-decoration:line-through;}
  .cal-more{position:absolute;bottom:2px;right:3px;font-size:8px;color:var(--ink-faint);font-weight:600;}
  .cal-legend{font-size:10.5px;color:var(--ink-faint);text-align:center;margin-top:10px;}
  .cal-legend-cancel{text-decoration:line-through;}
  .cal-empty{font-size:12.5px;color:var(--ink-faint);text-align:center;padding:14px 0;}
  .week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .week-col{border:1px solid var(--line-soft);border-radius:8px;padding:5px 4px;min-height:150px;}
  .week-col.today{border-color:var(--accent);background:rgba(var(--accent-rgb),.06);}
  .week-col-head{text-align:center;margin-bottom:5px;padding-bottom:5px;border-bottom:1px solid var(--line-soft);}
  .week-col-dow{display:block;font-size:9px;color:var(--ink-faint);font-weight:700;}
  .week-col-date{display:block;font-size:12px;font-weight:700;color:var(--ink);}
  .week-col.today .week-col-date{color:var(--accent-deep);}
  .week-col-body{display:flex;flex-direction:column;gap:3px;}
  .week-item{background:var(--accent);color:#fff;border-radius:5px;padding:3px 4px;cursor:pointer;}
  .week-item-cancel{background:var(--ink-faint);text-decoration:line-through;}
  .week-item-time{font-size:8px;font-weight:700;opacity:.9;}
  .week-item-title{font-size:9px;line-height:1.35;word-break:break-word;}
  .week-empty{font-size:9px;color:var(--ink-faint);text-align:center;padding-top:8px;}
  /* ── 일정 상세 팝업 ── */
  .detail-scrim{position:fixed;inset:0;background:rgba(20,22,26,.42);display:none;align-items:center;justify-content:center;z-index:60;padding:16px;}
  .detail-scrim.show{display:flex;}
  .detail-modal{background:var(--paper);border-radius:14px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden;}
  .detail-head{display:flex;align-items:center;justify-content:space-between;padding:15px 17px;border-bottom:1px solid var(--line);}
  .detail-head h3{margin:0;font-size:14.5px;font-weight:700;}
  .detail-close{width:26px;height:26px;border-radius:8px;border:none;background:var(--bg);cursor:pointer;color:var(--ink-soft);}
  .detail-body{padding:15px 17px;}
  .detail-row{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--line-soft);}
  .detail-row:last-child{border-bottom:none;}
  .detail-lbl{flex-shrink:0;width:70px;font-size:11.5px;font-weight:700;color:var(--ink-faint);}
  .detail-val{font-size:13px;color:var(--ink);line-height:1.5;white-space:pre-wrap;}
</style>
</head>
<body>
  <div class="card" id="card"><div class="state-loading">불러오는 중…</div></div>
  <div class="detail-scrim" id="detail-scrim" onclick="if(event.target===this)closeDetail()">
    <div class="detail-modal" id="detail-modal"></div>
  </div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
/* ══════════════ Firebase 설정 — 본인 프로젝트 값으로 교체하세요 ══════════════ */
const firebaseConfig = {
  apiKey: "AIzaSyD7jN8RBv0preJmxNVBZwiacznq7-UdGM4",
  authDomain: "contractor-visit.firebaseapp.com",
  projectId: "contractor-visit",
  storageBucket: "contractor-visit.firebasestorage.app",
  messagingSenderId: "335380660226",
  appId: "1:335380660226:web:b56a9cf5727671c23ae71b",
  measurementId: "G-YR2DSRJZFN"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ══════════════ 상태 ══════════════ */
const params = new URLSearchParams(location.search);
const companyId = params.get('co');
let company = null;

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function pad(n){return String(n).padStart(2,'0');}
function todayStr(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}

/* ══════════════ 내가 신청한 내역 (이 브라우저 기준, 로컬 저장) ══════════════ */
function lsKey(){return 'myReqs_'+companyId;}
function myReqIds(){try{return JSON.parse(localStorage.getItem(lsKey())||'[]');}catch(e){return [];}}
function addMyReqId(id){const list=myReqIds();list.unshift(id);localStorage.setItem(lsKey(), JSON.stringify(list.slice(0,30)));}
function removeMyReqId(id){localStorage.setItem(lsKey(), JSON.stringify(myReqIds().filter(x=>x!==id)));}

/* ══════════════ 알림 (확정 일정 변경 등, 회사 전체 공유) ══════════════ */
let allNotifs=[];
function notifKey(){return 'notifSeen_'+companyId;}
function seenNotifIds(){try{return new Set(JSON.parse(localStorage.getItem(notifKey())||'[]'));}catch(e){return new Set();}}
function markNotifsSeen(ids){
  const seen=seenNotifIds();
  ids.forEach(id=>seen.add(id));
  localStorage.setItem(notifKey(), JSON.stringify([...seen].slice(-200)));
}
function notifMillis(n){
  if(!n.createdAt)return 0;
  if(typeof n.createdAt.toMillis==='function')return n.createdAt.toMillis();
  if(n.createdAt.seconds)return n.createdAt.seconds*1000;
  return 0;
}
function loadNotifs(){
  db.collection('notifications').where('companyId','==',companyId).get().then(snap=>{
    allNotifs = snap.docs.map(d=>Object.assign({id:d.id}, d.data())).sort((a,b)=>notifMillis(b)-notifMillis(a));
    renderBellBadge();
  }).catch(()=>{});
}
function renderBellBadge(){
  const seen=seenNotifIds();
  const unread=allNotifs.filter(n=>!seen.has(n.id)).length;
  const badge=document.getElementById('notif-badge');
  if(!badge)return;
  if(unread>0){badge.textContent=unread>9?'9+':unread;badge.style.display='inline-flex';}
  else{badge.style.display='none';}
}
function toggleNotifPanel(){
  const panel=document.getElementById('notif-panel');
  if(!panel)return;
  const willShow=!panel.classList.contains('show');
  panel.classList.toggle('show');
  if(willShow){
    panel.innerHTML = allNotifs.length ? allNotifs.slice(0,25).map(n=>
      `<div class="notif-item"><div class="notif-title">${esc(n.title||'')}</div><div class="notif-msg">${esc(n.message||'')}</div></div>`
    ).join('') : '<div class="notif-empty">알림이 없어요.</div>';
    markNotifsSeen(allNotifs.map(n=>n.id));
    renderBellBadge();
  }
}

/* ══════════════ 채팅 (우리 회사 ↔ 담당자) ══════════════ */
let chatUnsub=null;
let chatMsgs=[];
function chatNameKey(){return 'chatName_'+companyId;}
function getChatName(){return localStorage.getItem(chatNameKey())||'';}
function setChatName(v){localStorage.setItem(chatNameKey(), v);}
function chatMillis(m){
  if(!m.createdAt)return 0;
  if(typeof m.createdAt.toMillis==='function')return m.createdAt.toMillis();
  if(m.createdAt.seconds)return m.createdAt.seconds*1000;
  return 0;
}
function renderChatTab(){
  const savedName=getChatName();
  document.getElementById('body-area').innerHTML = `
    <div class="chat-thread">
      <div class="chat-name-row"><div class="field-lbl">보내는 분 성함</div>
        <input type="text" class="m-in" id="chat-name-input" placeholder="예: 이태균" value="${esc(savedName)}" oninput="setChatName(this.value)"></div>
      <div class="chat-bubbles" id="chat-bubbles"><div class="chat-empty">불러오는 중…</div></div>
      <div class="chat-input-row">
        <input type="text" class="m-in" id="chat-msg-input" placeholder="메시지를 입력하세요" onkeydown="if(event.key==='Enter')sendChatMsg()">
        <button class="chat-send" onclick="sendChatMsg()">전송</button>
      </div>
    </div>`;
  chatUnsub = db.collection('messages').where('companyId','==',companyId).onSnapshot(snap=>{
    chatMsgs = snap.docs.map(d=>Object.assign({id:d.id}, d.data())).sort((a,b)=>chatMillis(a)-chatMillis(b));
    renderChatBubbles();
  }, err=>{ const el=document.getElementById('chat-bubbles'); if(el)el.innerHTML=`<div class="chat-empty">불러오지 못했어요: ${esc(err.message)}</div>`; });
}
function renderChatBubbles(){
  const el=document.getElementById('chat-bubbles');
  if(!el)return;
  el.innerHTML = chatMsgs.length ? chatMsgs.map(m=>{
    const mine=m.sender==='company';
    return `<div class="chat-bubble-row ${mine?'mine':''}">
      <div class="chat-bubble ${mine?'mine':''}">
        ${!mine?`<div class="chat-bubble-name">담당자</div>`:''}
        <div class="chat-bubble-text">${esc(m.text||'')}</div>
      </div>
    </div>`;
  }).join('') : '<div class="chat-empty">아직 대화가 없어요. 궁금한 점을 남겨보세요.</div>';
  el.scrollTop=el.scrollHeight;
}
function sendChatMsg(){
  const input=document.getElementById('chat-msg-input');
  const text=input.value.trim();
  if(!text)return;
  const name=getChatName().trim();
  if(!name){ alert('보내는 분 성함을 먼저 입력해주세요.'); document.getElementById('chat-name-input').focus(); return; }
  input.value='';
  db.collection('messages').add({
    companyId: companyId,
    sender: 'company',
    senderName: name,
    text: text,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).catch(err=>alert('전송 실패: '+err.message));
}


/* ══════════════ 공지사항 배너 ══════════════ */
function dismissedAnnKey(){return 'dismissedAnn_'+companyId;}
function dismissedAnnIds(){try{return new Set(JSON.parse(localStorage.getItem(dismissedAnnKey())||'[]'));}catch(e){return new Set();}}
function dismissAnn(id){
  const set=dismissedAnnIds(); set.add(id);
  localStorage.setItem(dismissedAnnKey(), JSON.stringify([...set]));
  const el=document.getElementById('ann-'+id);
  if(el)el.remove();
}
function loadAnnouncements(){
  db.collection('announcements').where('active','==',true).get().then(snap=>{
    const dismissed=dismissedAnnIds();
    const anns=snap.docs.map(d=>Object.assign({id:d.id}, d.data())).filter(a=>!dismissed.has(a.id));
    const wrap=document.getElementById('ann-banners');
    if(!wrap)return;
    wrap.innerHTML = anns.map(a=>`
      <div class="ann-banner" id="ann-${a.id}">
        <div class="ann-banner-body"><div class="ann-banner-title">📢 ${esc(a.title||'')}</div>${a.body?`<div class="ann-banner-text">${esc(a.body)}</div>`:''}</div>
        <button class="ann-banner-close" onclick="dismissAnn('${a.id}')">✕</button>
      </div>`).join('');
  }).catch(()=>{});
}

function renderError(msg){
  document.getElementById('card').innerHTML = `<div class="state-error">⚠️ ${esc(msg)}</div>`;
}

let pageMode='form'; // 'form' | 'cal'
function setMode(m){ if(chatUnsub){chatUnsub();chatUnsub=null;} pageMode=m; renderShell(); }

function renderShell(){
  document.getElementById('card').innerHTML = `
    <div class="head">
      <span class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2.5"/><path d="M3 9h18M8 2v4M16 2v4"/></svg></span>
      <div><h1>입회 일정 신청</h1><div class="sub">협력사 신청 → 담당자 확인 후 승인</div></div>
      <button class="notif-bellbtn" id="notif-bellbtn" onclick="toggleNotifPanel()">🔔<span id="notif-badge" class="notif-badge" style="display:none;"></span></button>

    <div id="notif-panel" class="notif-panel"></div>

    <div class="company-badge">

  document.getElementById('body-area').innerHTML = `
    <div id="form-area">
      <div class="row2">
        <div><div class="field-lbl">희망 시작일</div><input type="date" class="m-in" id="f-start" value="${todayStr()}"></div>

      </div>
      <div class="m-block"><div class="field-lbl">프로젝트명</div><input type="text" class="m-in" id="f-project" placeholder="예: AWS 데이터센터"></div>
      <div class="row2">
        <div><div class="field-lbl">신청 제목</div><input type="text" class="m-in" id="f-title" placeholder="예: 변압기 출하검사 입회 요청"></div>

      <div class="m-block"><div class="field-lbl">신청자 성함</div><input type="text" class="m-in" id="f-requester" placeholder="예: 홍길동"></div>
      <div class="m-block"><div class="field-lbl">비고 (선택)</div><textarea class="m-ta" id="f-memo" placeholder="준비물, 특이사항 등"></textarea></div>
      <div id="msg-area"></div>

function renderSuccess(){
  document.getElementById('body-area').innerHTML = `
    <div class="success-wrap">
      <div class="ico">✅</div>
      <h2>신청이 접수됐어요</h2>
      <p>담당자 확인 후 일정에 반영됩니다.<br>승인·거절 결과는 이 화면 아래 목록에서 바로 확인하실 수 있어요.</p>
      <button class="btn-ghost" onclick="renderForm()">다른 일정 신청하기</button>
    </div>
    <div id="my-reqs"></div>`;
  renderMyRequests();
}

function reqRangeTxt(d){
  const mm=d.date.split('-')[1], dd=d.date.split('-')[2];
  const range=(d.endDate&&d.endDate!==d.date) ? `${+mm}/${+dd}~${d.endDate.split('-').slice(1).map(Number).join('/')}` : `${+mm}/${+dd}`;
  return d.time?`${range} · ${d.time}`:range;
}
function reqTitleTxt(d){
  return `${d.project?`[${esc(d.project)}] `:''}${esc(d.title||'(제목 없음)')}${d.qty?` · ${d.qty}대`:''}`;
}

function renderMyRequests(){
  const wrap=document.getElementById('my-reqs');
  if(!wrap)return;
  const ids=myReqIds();
  if(!ids.length){wrap.innerHTML='';return;}
  wrap.innerHTML=`<div class="myreq-head">📋 내가 신청한 내역 <span>(이 기기에서 신청한 것만 보여요)</span></div><div id="myreq-list" class="myreq-list"><div class="myreq-loading">불러오는 중…</div></div>`;
  Promise.all(ids.map(id=>db.collection('requests').doc(id).get()
    .then(doc=>({id, fetched:true, exists:doc.exists, data:doc.exists?doc.data():null}))
    .catch(err=>({id, fetched:false, err}))
  )).then(results=>{
    const shown=[]; let hadError=false;
    results.forEach(r=>{
      if(!r.fetched){ hadError=true; return; }
      if(!r.exists){ removeMyReqId(r.id); return; }
      shown.push(r);
    });
    const listEl=document.getElementById('myreq-list');
    if(!listEl)return;
    if(hadError && !shown.length){
      document.getElementById('my-reqs').innerHTML = `<div class="myreq-head">📋 내가 신청한 내역</div><div class="myreq-err">불러오지 못했어요. 잠시 후 페이지를 새로고침해보세요.</div>`;
      return;
    }
    if(!shown.length){document.getElementById('my-reqs').innerHTML='';return;}
    listEl.innerHTML = shown.map(r=>{
      const d=r.data;
      if(d.status==='approved'){
        return `<div class="myreq-row">
          <div><div class="myreq-title">${reqTitleTxt(d)}</div><div class="myreq-date">${reqRangeTxt(d)} · <span class="myreq-badge ok">✅ 승인됨</span></div>${d.adminNote?`<div class="myreq-note">담당자 메모: ${esc(d.adminNote)}</div>`:''}</div>
        </div>`;
      }
      if(d.status==='rejected'){
        return `<div class="myreq-row">
          <div><div class="myreq-title">${reqTitleTxt(d)}</div><div class="myreq-date">${reqRangeTxt(d)} · <span class="myreq-badge no">✕ 거절됨</span></div>${d.adminNote?`<div class="myreq-note">거절 사유: ${esc(d.adminNote)}</div>`:'<div class="myreq-note">별도 사유가 입력되지 않았어요. 담당자에게 문의해주세요.</div>'}</div>
        </div>`;
      }
      return `<div class="myreq-row">
        <div><div class="myreq-title">${reqTitleTxt(d)}</div><div class="myreq-date">${reqRangeTxt(d)} · 대기중</div></div>
        <button class="myreq-del" onclick="deleteMyRequest('${r.id}')">🗑 삭제</button>
      </div>`;
    }).join('');
  });
}

/* ══════════════ 우리 회사 일정 (확정된 입회 일정, 읽기 전용 캘린더) ══════════════ */
let calView=new Date();
let calMode='month'; // 'month' | 'week'
let calWeekStart=weekStartOf(new Date());
let companyVisits=[];
function parseD(s){const[y,m,dd]=s.split('-').map(Number);return new Date(y,m-1,dd);}
function dnum(d){return Math.floor(d.getTime()/86400000);}
function weekStartOf(d){const r=new Date(d);r.setDate(r.getDate()-r.getDay());return r;}
const WD=['일','월','화','수','목','금','토'];

function renderCalendar(){
  document.getElementById('body-area').innerHTML = `<div class="cal-loading">불러오는 중…</div>`;
  db.collection('visits').where('companyId','==',companyId).get().then(snap=>{
    companyVisits = snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
    document.getElementById('body-area').innerHTML = calMode==='week'?weekViewHtml():calendarHtml();
  }).catch(err=>{
    document.getElementById('body-area').innerHTML = `<div class="myreq-err">불러오지 못했어요: ${esc(err.message)}</div>`;
  });
}
function shiftCal(n){ calView=new Date(calView.getFullYear(), calView.getMonth()+n, 1); document.getElementById('body-area').innerHTML=calendarHtml(); }
function shiftWeek(n){ calWeekStart=new Date(calWeekStart); calWeekStart.setDate(calWeekStart.getDate()+n*7); document.getElementById('body-area').innerHTML=weekViewHtml(); }
function setCalMode(m){
  calMode=m;
  if(m==='week')calWeekStart=weekStartOf(calView);
  document.getElementById('body-area').innerHTML = calMode==='week'?weekViewHtml():calendarHtml();
}
function calModeToggle(){
  return `<div class="cal-modetoggle">
    <button class="${calMode==='month'?'on':''}" onclick="setCalMode('month')">월간</button>
    <button class="${calMode==='week'?'on':''}" onclick="setCalMode('week')">주간</button>
  </div>`;
}

function openVisitDetail(id){
  const v=companyVisits.find(x=>x.id===id); if(!v)return;
  const cancelled=v.status==='취소';
  const mm=v.date.split('-')[1], dd=v.date.split('-')[2];
  const rangeTxt=(v.endDate&&v.endDate!==v.date)?`${v.date.split('-')[0]}. ${+mm}. ${+dd} ~ ${v.endDate.split('-').slice(1).map(Number).join('. ')}`:`${v.date.split('-')[0]}. ${+mm}. ${+dd}`;
  const stLabel={예정:'⏳ 예정',완료:'✅ 완료',연기:'↻ 연기',취소:'✕ 취소'}[v.status]||v.status||'예정';
  const row=(lbl,val)=>`<div class="detail-row"><span class="detail-lbl">${lbl}</span><span class="detail-val">${esc(val)}</span></div>`;
  document.getElementById('detail-modal').innerHTML=`
    <div class="detail-head"><h3>${cancelled?'✕ 취소된 일정':'📅 확정 일정'}</h3><button class="detail-close" onclick="closeDetail()">✕</button></div>
    <div class="detail-body">
      ${row('날짜', rangeTxt)}
      ${v.time?row('시간', v.time):''}
      ${v.project?row('프로젝트명', v.project):''}
      ${row('제목', v.title||'(제목 없음)')}
      ${v.qty?row('대수', v.qty+'대'):''}
      ${row('입회자', v.attendee||'미정')}
      ${v.memo?row('메모', v.memo):''}
      ${row('상태', stLabel)}
    </div>`;
  document.getElementById('detail-scrim').classList.add('show');
}
function closeDetail(){ document.getElementById('detail-scrim').classList.remove('show'); }

function calendarHtml(){
  const y=calView.getFullYear(), m=calView.getMonth();
  const first=new Date(y,m,1), startDow=first.getDay();
  const gridStart=new Date(y,m,1-startDow);
  const ts=todayStr();
  let cells='';
  for(let w=0; w<6; w++){
    let rowHasCur=false, row='';
    for(let d0=0; d0<7; d0++){
      const d=new Date(gridStart); d.setDate(gridStart.getDate()+w*7+d0);
      const s=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
      const muted=d.getMonth()!==m, isToday=s===ts;
      if(!muted) rowHasCur=true;
      const evs=companyVisits.filter(v=>v.date&&dnum(parseD(v.date))<=dnum(d)&&dnum(d)<=dnum(parseD(v.endDate||v.date)));
      const bars=evs.slice(0,3).map(v=>{
        const cancelled=v.status==='취소';
        const txt=`${v.time?v.time+' ':''}${v.title||'(제목 없음)'}`;
        return `<div class="cal-bar ${cancelled?'cal-bar-cancel':''}" onclick="event.stopPropagation();openVisitDetail('${v.id}')">${esc(txt)}</div>`;
      }).join('');
      const moreN=evs.length-3;
      row+=`<div class="cal-cell ${muted?'muted':''} ${isToday?'today':''}"><span class="cal-dnum">${d.getDate()}</span>${bars}${moreN>0?`<span class="cal-more">+${moreN}</span>`:''}</div>`;
    }
    if(rowHasCur||w<4) cells+=`<div class="cal-week">${row}</div>`;
  }
  const hasAny = companyVisits.length>0;
  return `
    ${calModeToggle()}
    <div class="cal-nav">
      <button class="cal-navbtn" onclick="shiftCal(-1)">‹</button>
      <span class="cal-month">${y}년 ${m+1}월</span>
      <button class="cal-navbtn" onclick="shiftCal(1)">›</button>
    </div>
    <div class="cal-weekdays">${WD.map(w=>`<div>${w}</div>`).join('')}</div>
    ${cells}
    ${hasAny?`<div class="cal-legend">진하게 표시된 항목이 확정된 일정이에요 (<span class="cal-legend-cancel">취소선</span>은 취소된 일정)</div>`:`<div class="cal-empty">아직 확정된 일정이 없어요.</div>`}
  `;
}

function weekViewHtml(){
  const start=new Date(calWeekStart);
  const days=Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return d;});
  const ts=todayStr();
  const end=days[6];
  const rangeLbl = start.getMonth()===end.getMonth()
    ? `${start.getMonth()+1}월 ${start.getDate()}~${end.getDate()}일`
    : `${start.getMonth()+1}월 ${start.getDate()}일 ~ ${end.getMonth()+1}월 ${end.getDate()}일`;
  const cols=days.map(d=>{
    const s=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    const isToday=s===ts;
    const evs=companyVisits.filter(v=>v.date&&dnum(parseD(v.date))<=dnum(d)&&dnum(d)<=dnum(parseD(v.endDate||v.date)))
      .sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    const items=evs.length?evs.map(v=>{
      const cancelled=v.status==='취소';
      return `<div class="week-item ${cancelled?'week-item-cancel':''}" onclick="openVisitDetail('${v.id}')">
        ${v.time?`<div class="week-item-time">${esc(v.time)}</div>`:''}
        <div class="week-item-title">${esc(v.title||'(제목 없음)')}</div>
      </div>`;
    }).join(''):'<div class="week-empty">-</div>';
    return `<div class="week-col ${isToday?'today':''}">
      <div class="week-col-head"><span class="week-col-dow">${WD[d.getDay()]}</span><span class="week-col-date">${d.getDate()}</span></div>
      <div class="week-col-body">${items}</div>
    </div>`;
  }).join('');
  const hasAny = companyVisits.length>0;
  return `
    ${calModeToggle()}
    <div class="cal-nav">
      <button class="cal-navbtn" onclick="shiftWeek(-1)">‹</button>
      <span class="cal-month">${rangeLbl}</span>
      <button class="cal-navbtn" onclick="shiftWeek(1)">›</button>
    </div>
    <div class="week-grid">${cols}</div>
    ${hasAny?`<div class="cal-legend">시간 있는 일정은 이른 시간 순으로 정렬돼요 (<span class="cal-legend-cancel">취소선</span>은 취소된 일정)</div>`:`<div class="cal-empty">아직 확정된 일정이 없어요.</div>`}
  `;
}

function deleteMyRequest(id){
  if(!confirm('이 신청을 삭제할까요?\n잘못 신청했을 때만 사용하세요.'))return;
  db.collection('requests').doc(id).delete().then(()=>{
    removeMyReqId(id);
    toast_myreq('삭제했어요.');
    renderMyRequests();
  }).catch(err=>{
    toast_myreq('삭제 실패: '+err.message);
  });
}
function toast_myreq(msg){ showMsg(msg,'ok'); setTimeout(()=>{const el=document.getElementById('msg-area'); if(el)el.innerHTML='';},2500); }

function showMsg(text,type){
  const el=document.getElementById('msg-area');
  if(el)el.innerHTML = `<div class="msg ${type}">${esc(text)}</div>`;
}

function submitRequest(){
  const start=document.getElementById('f-start').value;
  const end=document.getElementById('f-end').value || start;
  const project=document.getElementById('f-project').value.trim();
  const title=document.getElementById('f-title').value.trim();
  const qtyRaw=document.getElementById('f-qty').value;
  const qty=qtyRaw===''?null:Math.max(0,parseInt(qtyRaw,10)||0);
  const time=document.getElementById('f-time').value.trim();
  const requester=document.getElementById('f-requester').value.trim();
  const memo=document.getElementById('f-memo').value.trim();
  if(!start){showMsg('희망 시작일을 선택해주세요.','error');return;}
  if(end<start){showMsg('종료일이 시작일보다 빠를 수 없어요.','error');return;}
  if(!project){showMsg('프로젝트명을 입력해주세요.','error');return;}
  if(!title){showMsg('신청 제목을 입력해주세요.','error');return;}
  if(!requester){showMsg('신청자 성함을 입력해주세요.','error');return;}

  const btn=document.getElementById('submit-btn');
  btn.disabled=true; btn.textContent='확인 중…';

  const payload={
    companyId: companyId,
    companyName: company.name,
    date: start,
    endDate: end,
    project: project,
    title: title,
    qty: qty,
    time: time,
    requester: requester,
    memo: memo,
    status: 'pending',
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  };

  db.collection('visits').where('companyId','==',companyId).get().then(snap=>{
    const overlapping = snap.docs.map(d=>d.data()).filter(v=>
      v.status!=='취소' && v.date && v.date<=end && (v.endDate||v.date)>=start
    );
    if(overlapping.length){
      const list=overlapping.map(v=>`- ${v.date}${v.time?' '+v.time:''} ${v.title||''}`).join('\n');
      const proceed=confirm(`⚠️ 같은 기간에 이미 확정된 일정이 있어요:\n\n${list}\n\n그래도 신청하시겠어요?`);
      if(!proceed){ btn.disabled=false; btn.textContent='신청하기'; return; }
    }
    doSubmit(payload, btn);
  }).catch(()=>{
    // 확인 실패해도 신청 자체는 막지 않음
    doSubmit(payload, btn);
  });
}

function doSubmit(payload, btn){
  btn.textContent='신청 중…';
  db.collection('requests').add(payload).then(docRef=>{
    addMyReqId(docRef.id);
    renderSuccess();
  }).catch(err=>{
    btn.disabled=false; btn.textContent='신청하기';
    showMsg('신청 중 오류가 발생했어요: '+err.message,'error');
  });
}

/* ══════════════ 초기화 ══════════════ */
if(!companyId){
  renderError('협력사 코드가 없어요. 담당자에게 받은 링크로 다시 접속해주세요.');
}else{
  db.collection('companies').doc(companyId).get().then(doc=>{
    if(!doc.exists){renderError('등록되지 않은 협력사 링크예요. 담당자에게 확인해주세요.');return;}
    company = doc.data();
    renderShell();
  }).catch(err=>{
    renderError('불러오는 중 오류가 발생했어요: '+err.message);
  });
}
</script>
